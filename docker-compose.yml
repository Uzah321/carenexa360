services:
  postgres:
    image: postgres:17-alpine
    container_name: carenexa360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carenexa360
      POSTGRES_USER: carenexa
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - carenexa360-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: carenexa360-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - carenexa360-redis-data:/data

  # Road-snapping for the Live Map's carer trails. Data files are prepared by
  # scripts/setup-osrm.sh (not part of the image) — run that first. Internal
  # only: nothing outside this host needs to reach it directly.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: carenexa360-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-matching-size 100 /data/${OSRM_REGION_FILE:-zimbabwe-latest.osrm}
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./osrm-data:/data

volumes:
  carenexa360-postgres-data:
  carenexa360-redis-data:
